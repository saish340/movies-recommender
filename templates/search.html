<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-gradient">
    <div class="container py-5">
        <h2 class="text-white mb-4">Results for "{{ query }}"</h2>
        <div class="row">
            {% if movies %}
                {% for movie in movies %}
                <div class="col-md-4 mb-4">
                    <div class="card movie-card h-100 animated-card">
                        <img src="{{ movie.Poster if movie.Poster != 'N/A' else url_for('static', filename='images/no-poster.png') }}" class="card-img-top" alt="{{ movie.Title }} poster">
                        <div class="card-body">
                            <h5 class="card-title">{{ movie.Title }}</h5>
                            <p class="card-text">Year: {{ movie.Year }}<br>Type: {{ movie.Type|capitalize }}</p>
                            <a href="{{ url_for('movie_details', imdb_id=movie.imdbID) }}" class="btn btn-gradient">Details</a>
                        </div>
                    </div>
                </div>
                {% endfor %}
            {% else %}
                <div class="col-12">
                    <div class="alert alert-warning text-center mt-4">No results found for "{{ query }}".</div>
                </div>
            {% endif %}
        </div>
        <a href="{{ url_for('home') }}" class="btn btn-secondary mt-4">Back to Home</a>
    </div>
</body>
</html>
